spring:
  application:
    name: demo
  # ===== Redis 连接配置（本地默认）=====
  # 默认连本地 master：docker-compose 起的 redis-master，宿主机映射端口 16379。
  # （本机 6379 已被 Windows 服务 redis(native) 占用且有密码，故用 16379 避开冲突。）
  # 本地手动调试（IDEA 直接 run / mvn spring-boot:run / java -jar）无需任何额外参数。
  # 集群内联调用 profile=k8s（见 application-k8s.yaml），由 deployment.yaml 注入
  # SPRING_PROFILES_ACTIVE=k8s，连 master 的 Pod DNS。
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password:                                # 本地 Redis 无密码，留空
      timeout: 5000ms
  # ===== Kafka 连接配置（本地默认）=====
  # 本地 Docker 起的单节点 Kafka（KRaft 模式），宿主机映射端口 9092。
  # 集群内联调用若 Kafka 也上 K8s（Strimzi），需切 profile=k8s 把 bootstrap-servers 改成
  # Kafka Service DNS（如 kafka.default.svc.cluster.local:9092），与 Redis 的 k8s profile 同思路。
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1                       # 本地单副本，leader 落盘即算成功（生产建议 all + min.insync.replicas）
    consumer:
      group-id: demo-group
      auto-offset-reset: earliest   # 新组从头读，便于演示"发过的历史也能消费到"
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  # ===== AI / LLM 多供应商多模型配置 =====
  # 供应商与模型定义在 ai/AiProvider.java、ai/AiModel.java，这里只配「端点 + 密钥」。
  # 端点不能带 /v1：Spring AI 会自动拼 /v1/chat/completions（带了会拼成 /v1/v1/ 404）。
  # 密钥优先读这里，读不到再回落环境变量；不写死真实 Key，只写 ${ENV_VAR}。
  ai:
    providers:
      sensenova:                                     # 商汤 SenseNova Token Plan（免费 500 次/5h）
        # base-url: https://token.sensenova.cn        # 枚举已有默认，需要覆盖才写
        api-key: ${SENSENOVA_API_KEY:}
      dashscope:                                     # 阿里通义千问
        api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY:}}
      deepseek:                                      # DeepSeek 官方
        api-key: ${DEEPSEEK_API_KEY:}
      chatanywhere:                                  # ChatAnywhere 聚合转发（一个 Key 接多家模型）
        api-key: ${CHATANYWHERE_API_KEY:}
    # ===== MCP Client 配置：本应用作为 MCP Client，通过 stdio 拉起独立的 MCP Server 进程 =====
    # 演示「客户端-服务端」完整协议闭环：client 拉起独立 server 进程，拿到它暴露的天气工具，
    # 再注册进 ChatClient 供模型调用。
    mcp:
      client:
        type: SYNC
        request-timeout: 20s
        stdio:
          connections:
            weather-mcp-server:        # 连接名（自定义）
              command: java            # 启动独立 server 进程的命令
              args:
                - -Dfile.encoding=UTF-8   # 关键：强制 server 进程 UTF-8，否则中文城市名经 stdio 传输会乱码
                - -Dhttp.proxyHost=${MCP_PROXY_HOST:127.0.0.1}   # 让独立 server 进程走代理访问外网（Clash）
                - -Dhttp.proxyPort=${MCP_PROXY_PORT:7897}
                - -Dhttps.proxyHost=${MCP_PROXY_HOST:127.0.0.1}
                - -Dhttps.proxyPort=${MCP_PROXY_PORT:7897}
                - -jar
                - ${MCP_SERVER_JAR:target/demo-0.0.6-mcp-server.jar}   # 独立 server 的 jar（环境变量可覆盖）
                - --spring.config.name=application-mcp-server   # 用 server 专属配置（含 stdio:true）
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: true
