# 本地手动调试用：一主两从 Redis（1 master + 2 replica）
# 启动：docker compose up -d
# 停止：docker compose down          （加 -v 可清空数据卷）
#
# 端口映射（宿主机 -> 容器 6379）：
#   master   -> localhost:16379
#   replica1 -> localhost:16380
#   replica2 -> localhost:16381
# 注：宿主机 6379 已被本机 Windows 服务 redis(native) 占用且有密码，故这里用 16379+ 避免冲突。
# 验证主从复制：见 verify-replication.sh
services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-master-data:/data

  redis-replica1:
    image: redis:7-alpine
    container_name: redis-replica1
    ports:
      - "16380:6379"
    # 启动即认 redis-master 为主；master 未就绪时会自动重试，无需担心顺序
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    depends_on:
      - redis-master
    volumes:
      - redis-replica1-data:/data

  redis-replica2:
    image: redis:7-alpine
    container_name: redis-replica2
    ports:
      - "16381:6379"
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    depends_on:
      - redis-master
    volumes:
      - redis-replica2-data:/data

volumes:
  redis-master-data:
  redis-replica1-data:
  redis-replica2-data:
